<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задвч</title>
    <style>
        table{
            border: 2px solid #790;
        }
        table td{border: 1px solid rgb(10, 8, 14);padding: 5px;}
        .alarm{
        background-color: red; color:rgb(0, 0, 0); font-weight: 600;
    }
    .warning{
        background-color: rgb(241, 151, 54); color:white;
    }
    .complete{background-color: #790; color: white;}
    </style>
</head>
<body>
    <form action="">
        <input type="text" id="inputTask" placeholder="Текст задачи">
        <input type="datetime-local" id="inputDeadline">
        <input type="submit">
    </form>
    <h3>Список задач:</h3>
    <button onclick="removeAllItems()" >удалить всё</button>
    <table id="result">
        <thead>
            <th>№</th>
            <th>Задача</th>
            <th>создано</th>
            <th>дедлайн</th>
            <th>дествие</th>
        </thead>
    </table>
<script src="localstorage.js"></script>
</body>
</html>

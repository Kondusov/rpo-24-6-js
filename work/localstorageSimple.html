// Получать строку из формы и добавлять в localstorage
// при загрузке страницы отображать все записи из localstorage -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn_clear">удалить все записи</button><!--onclick="localStorage.clear(); location.reload()"-->
    <form action="">
        <input type="text">
        <input type="submit">
    </form>
    <script>
        document.querySelector('form').addEventListener('submit', (event)=>{
            //event.preventDefault();
            let text = document.querySelector('input[type="text"]').value;
            console.log(text)
            localStorage.setItem(localStorage.length, text);
        });
        for(i=0; i<localStorage.length; i++){
            let elem = document.createElement('p');
            elem.textContent = localStorage.getItem(i);
            document.querySelector('body').append(elem);
        }
        btn_clear.addEventListener('click', ()=>{
            localStorage.clear(); location.reload();
        })
    </script>
</body>
</html>
